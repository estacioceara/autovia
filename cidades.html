<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style>
    html, body, section, .col {
        height: 100%;
    }
</style>

<section class="row">
    <div class="col bg-dark"></div>
    <div class="col bg-light pt-5">
        <div class="card card-body shadow-lg m-5">
        <h3>Endereço</h3>
        <hr>
        <form action="">
            <label>Região</label>
            <select onchange="buscarEstados()" id="regiao" class="form-select mb-3">
                <option value="" disabled selected>-- Selecione --</option>
            </select>

            <label>Estado</label>
            <select id="estado" class="form-select mb-3">
                <option value="" disabled selected>-- Selecione --</option>
            </select>

            <label>Cidade</label>
            <select id="cidade" class="form-select mb-3">
                <option value="" disabled selected>-- Selecione --</option>
            </select>

            <button class="btn btn-primary w-100">Cadastrar</button>
        </form>
        </div>

    </div>
</section>


<script>
    const SELECT_REGIAO = document.getElementById("regiao");
    const SELECT_ESTADO = document.getElementById("estado");
    const SELECT_CIDADE = document.getElementById("cidade");

    fetch("https://servicodados.ibge.gov.br/api/v1/localidades/regioes")
        .then(res => res.json())
        .then(dados => {
            dados.map((cada) => {
                SELECT_REGIAO.innerHTML += `
                    <option value="${cada.id}">${cada.nome}</option>
                `;
            });
        });

    function buscarEstados () {
        let regiaoSelecionada = SELECT_REGIAO.value;

        fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/regioes/${regiaoSelecionada}/estados`)
        .then(res => res.json())
        .then(dados => {
            dados.map((cada) => {
                SELECT_ESTADO.innerHTML += `
                    <option>${cada.nome}</option>
                `;
            });
        });
    }
</script>
