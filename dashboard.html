<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Gráficos Aprimorados</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --card-bg: #ffffff;
            --muted: #6c757d;
            --accent: linear-gradient(90deg, #4f46e5, #06b6d4);
        }

        .card-graph {
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
        }

        h1.title {
            font-size: 1.6rem
        }

        .card-graph h5 {
            font-size: 0.95rem
        }

        .chart-legend {
            font-size: 0.85rem;
            color: var(--muted)
        }

        .small-muted {
            font-size: 0.8rem;
            color: var(--muted)
        }

        canvas {
            width: 100% !important;
        }
    </style>
</head>

<body class="container-fluid p-0 bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-2 px-3 rounded-3 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="img/logo.png" class="rounded-circle me-2" style="max-width: 60px; max-height: 60px;">
                <strong class="fs-3">Autovia</strong>
            </a>

            <div class="mx-auto d-none d-lg-flex gap-2">
                <a class="btn btn-dark" href="dashboard.html">Dashboard</a>
                <a class="btn btn-outline-dark" href="clientes.html">Clientes</a>
                <a class="btn btn-outline-dark" href="veiculos.html">Veículos</a>
                <a class="btn btn-outline-dark" href="vendas.html">Vendas</a>
                <a class="btn btn-outline-dark" href="faq.html">FAQ</a>
            </div>

            <div class="d-flex align-items-center gap-3 ">

                <div class="d-flex align-items-center">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" width="40" height="40"
                        class="rounded-circle me-2">
                    <div class="d-none d-lg-block">
                        <span class="fw-semibold">Usuário</span><br>
                        <small class="text-muted">Conta</small>
                    </div>
                </div>

                <a class="btn btn-outline-danger btn-sm ms-2" href="index.html">Sair</a>
            </div>
        </div>
    </nav>

    <section class="container py-4">
        <div class="shadow-sm p-4 mb-4 card-graph">
            <h1 class="mb-2 title">Boas vindas, Usuário </h1>
            <p class="small-muted">Resumo rápido dos principais indicadores do painel.</p>
        </div>

        <div class="row g-4">

            <div class="col-lg-6">
                <div class="card p-3 card-graph">
                    <h5 class="fw-semibold mb-3">Gráfico 1 — Visitas por dia</h5>
                    <canvas id="grafico1"></canvas>
                    <div class="d-flex justify-content-between mt-2">
                        <div class="small-muted">Última atualização: 23/11/2025</div>
                        <div class="chart-legend">Visitas totais: <strong id="visitasTotal">0</strong></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card p-3 card-graph">
                    <h5 class="fw-semibold mb-3">Gráfico 2 — Vendas do trimestre</h5>
                    <canvas id="grafico2"></canvas>
                    <div class="d-flex justify-content-between mt-2">
                        <div class="small-muted">Comparativo mensal</div>
                        <div class="chart-legend">Crescimento: <strong id="crescimentoPct">0%</strong></div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="js/home.js"></script>
</body>

</html>
